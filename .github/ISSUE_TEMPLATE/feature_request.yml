name: Đề xuất tính năng / Feature request
description: Ý tưởng cho app, studio hay bản việt hóa. (English welcome.)
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Đây là bản fork. Đề xuất về **engine, kiến trúc hay hành vi tác tử** hợp hơn khi gửi thẳng cho upstream [voocel/ainovel-cli](https://github.com/voocel/ainovel-cli). Đề xuất về **app desktop, studio, việt hóa** thì ở đây là đúng chỗ.
  - type: textarea
    id: problem
    attributes:
      label: Vấn đề
      description: Bạn đang cố làm gì, và điều gì đang cản trở? Mô tả vấn đề trước, giải pháp sau.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Đề xuất
      description: Bạn hình dung nó hoạt động thế nào?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Cách khác đã cân nhắc
  - type: dropdown
    id: area
    attributes:
      label: Phần nào của app
      options:
        - App desktop (cài đặt, cập nhật, menu, cửa sổ)
        - Studio (Tủ truyện, Tiến độ, Đọc truyện)
        - Cấu hình nhà cung cấp / model
        - Xuất bản / nhập truyện
        - Việt hóa / prompt / văn phong
        - Tài liệu
        - Khác
  - type: checkboxes
    id: checks
    attributes:
      label: Xác nhận
      options:
        - label: Tôi đã tìm trong các issue hiện có và không thấy đề xuất trùng.
          required: true
