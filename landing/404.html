<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Không tìm thấy trang — AINovel Studio</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/chu.css">
<style>
  /* Trang 404 riêng: thiếu tệp này thì Cloudflare Pages coi trang là SPA và trả
     index.html kèm 200 cho mọi đường dẫn sai — công cụ tìm kiếm sẽ chỉ mục URL ảo. */
  :root {
    --bg: oklch(0.155 0.008 74);
    --ink: oklch(0.945 0.010 82);
    --ink-2: oklch(0.755 0.012 82);
    --gold: oklch(0.805 0.128 80);
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 'Inter', system-ui, sans-serif;
    padding: 24px;
  }
  main { max-width: 32rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: var(--ink-2); margin: 0 0 1.5rem; }
  a { color: var(--gold); }
</style>
</head>
<body>
<main>
  <h1>Không tìm thấy trang này</h1>
  <p>Đường dẫn bạn mở không tồn tại hoặc đã được chuyển đi.</p>
  <a href="/">← Về trang AINovel Studio</a>
</main>
</body>
</html>
